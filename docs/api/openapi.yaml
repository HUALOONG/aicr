    # ── 核心引擎 ───────────────────────────────────────────────────
    WebhookPayload:
      type: object
      description: |
        Git 平台原始事件 Payload，字段随平台不同（GitLab merge_request / GitHub pull_request / Gitea pull_request）。
        服务端仅依赖 object_attributes.iid(action/state 等) 与项目/仓库标识；签名头为 X-Gitlab-Token 或 X-Hub-Signature-256 / X-Gitea-Signature。
      additionalProperties: true
      properties:
        object_kind: { type: string, examples: [ 'merge_request' ] }
        action: { type: string, description: 'open/update/merge/close（GitHub/Gitea 为 opened/synchronize/closed）' }
        project: { type: object, additionalProperties: true }
        repository: { type: object, additionalProperties: true }
        object_attributes: { type: object, additionalProperties: true }
    WebhookAcceptedResponse:
      type: object
      required: [ code, message, requestId ]
      properties:
        code: { type: integer, description: '0=成功; 40301=签名失败(HTTP 401); 40001=参数错误(HTTP 400); 50001=队列满(HTTP 503)' }
        message: { type: string }
        data:
          type: object
          properties:
            status: { type: string, description: 'accepted=已入队; ignored=非目标事件; duplicate=幂等拦截', enum: [ accepted, ignored, duplicate ] }
            taskId: { type: integer, format: int64, description: status=accepted 时返回 }
            existTaskId: { type: integer, format: int64, description: status=duplicate 时返回 }
            reason: { type: string, description: status=ignored 时返回原因 }
        requestId: { type: string, format: uuid }
    WebhookRetryParam:
      type: object
      required: [ taskId ]
      properties: { taskId: { type: integer, format: int64 } }
    FeedbackReportParam:
      type: object
      required: [ taskId, commentId, feedbackType ]
      properties:
        taskId: { type: integer, format: int64 }
        commentId: { type: integer, format: int64 }
        feedbackType: { $ref: '#/components/schemas/FeedbackType' }
        reason: { type: string }
    FeedbackFeedbackReportParam:
      type: object
      properties: { timeRange: { $ref: '#/components/schemas/TimeRange' } }
    FeedbackFeedbackReportData:
      type: object
      properties:
