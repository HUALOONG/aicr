  # ── 核心引擎（4） ────────────────────────────────────────────────
  /webhook/receive:
    post:
      tags: [ 核心引擎 ]
      summary: Git 平台 Webhook 入站回调（FR-022）
      operationId: webhookReceive
      security: [ ]
      description: |
        无 Bearer 认证，改用平台签名校验（GitLab X-Gitlab-Token 直接比对；GitHub X-Hub-Signature-256 / Gitea X-Gitea-Signature 用 HMAC-SHA256，并附加 ±300s 时间窗）。
        仅做签名校验 + 幂等（事件级 24h + 业务级 60s 窗口，BR-W-07/BR-W-08）+ 建任务 + 入队，**不在接口线程执行 Diff 解析或 LLM 调用**（BR-W-02，P99 ≤200ms）。
        请求体为 Git 平台原始 Payload，结构随平台不同，此处以开放对象描述；非目标事件直接返回 200 ignored。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookPayload' }
      responses:
        '200':
          description: 处理成功 / 非目标事件 / 重复请求，均返回 200（BR-W-09）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookAcceptedResponse' }
              examples:
                accepted:
                  summary: 校验通过，任务已入队
                  value: { code: 0, message: 'success', data: { status: 'accepted', taskId: 123 }, requestId: 'uuid' }
                ignored:
                  summary: 非目标事件
                  value: { code: 0, message: 'success', data: { status: 'ignored', reason: 'not mr event' }, requestId: 'uuid' }
                duplicate:
                  summary: 幂等拦截
                  value: { code: 0, message: 'success', data: { status: 'duplicate', existTaskId: 123 }, requestId: 'uuid' }
        '400': { description: 参数错误（40001 invalid payload） }
        '401': { description: 签名验证失败（40301 invalid signature），不入 Body、写审计日志 }
        '503': { description: MQ 满或系统过载（50001 queue full），触发平台重试 }

  /webhook/retry:
    post:
      tags: [ 核心引擎 ]
      summary: Webhook 侧人工重试（FR-022）
      operationId: webhookRetry
      x-roles: [ ADMIN, PM ]
      description: service 仅发送 Kafka TOPIC_REVIEW_RETRY，由 worker 消费执行（HLD 红线二）
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReqBody_webhookRetry' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RespBody_OpResult' } } } }

  /feedback/report:
    post:
      tags: [ 核心引擎 ]
      summary: 评审意见反馈上报（FR-026）
      operationId: feedbackReport
      x-roles: [ ADMIN, PM, QA, DEVELOPER ]
      description: 驱动误报特征库（BR-FB-01）与确认样本库（BR-FB-03）；经 TOPIC_FEEDBACK 异步处理，不阻塞用户操作
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReqBody_feedbackReport' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RespBody_OpResult' } } } }

  /feedback/feedbackReport:
    post:
      tags: [ 核心引擎 ]
      summary: 模型效果周报（FR-026 / BR-FB-04）
      operationId: feedbackFeedbackReport
      x-roles: [ ADMIN, PM, QA ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReqBody_feedbackFeedbackReport' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RespBody_feedbackFeedbackReport' } } } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Token，有效期 7 天，支持 Refresh Token 续期（SRS §4.2）

  schemas:
    # ── 统一封装 ───────────────────────────────────────────────────
    RpcEnvelopeRequest:
      type: object
      description: 所有 RPC 请求的公共外层，业务参数一律置于 param
      properties:
        requestId: { type: string, format: uuid, description: 客户端生成用于幂等与链路追踪; 缺省由服务端补全 }

    RpcEnvelopeResponse:
      type: object
      description: 所有 RPC 响应的公共外层; 业务错误由 code 表达而非 HTTP 状态码
      required: [ code, message, requestId ]
      properties:
        code:
          type: integer
          format: int32
          description: '0=成功; 40001=参数校验失败; 40101=未登录或Token过期; 40301=无权限; 40401=资源不存在; 50001=系统内部错误; 50002=LLM调用失败'
          examples: [ 0 ]
        message: { type: string, description: 提示信息; 参数错误时可携带字段级明细, examples: [ 'success' ] }
        requestId: { type: string, format: uuid, description: 与请求一致或服务端生成 }

    OpResult: { type: object, description: 写操作成功返回; 无附加数据 }
    IdResult:
      type: object
      description: 创建类操作返回的主键
      required: [ id ]
      properties: { id: { type: integer, format: int64 } }

    PageRequest:
      type: object
      properties:
        page: { type: integer, minimum: 1, default: 1 }
        size: { type: integer, minimum: 1, maximum: 100, default: 20 }

    TimeRange:
      type: object
      description: 时间范围; 缺省为近 30 天
      properties:
        start: { type: string, format: date, examples: [ '2026-08-09' ] }
        end: { type: string, format: date, examples: [ '2026-09-08' ] }

    IdParam:
      type: object
      required: [ id ]
      properties: { id: { type: integer, format: int64 } }

    TaskIdParam:
      type: object
      required: [ taskId ]
      properties: { taskId: { type: integer, format: int64, examples: [ 10023 ] } }

    ToggleStatusParam:
      type: object
      required: [ id, status ]
      properties:
        id: { type: integer, format: int64 }
        status: { type: integer, enum: [ 0, 1 ], description: '1=启用; 0=停用' }

    # ── 枚举 ───────────────────────────────────────────────────────
    SubStatus:
      type: string
      description: 任务业务状态唯一口径，共 14 个（review_task.sub_status）
      enum: [ RECEIVED, PARSING, QUEUED, ANALYZING, GENERATING_TEST, WRITING_BACK, RETRYING, TIMEOUT, COMPLETED, PARTIAL_SUCCESS, DEGRADED, FAILED, CANCELLED, SKIPPED_QUOTA ]
    MainStatus:
      type: integer
      description: '任务主状态 review_task.status; 0-待处理/1-处理中/2-已完成/3-失败/4-已取消; 仅用于统计聚合'
      enum: [ 0, 1, 2, 3, 4 ]
    Dimension: { type: string, description: 评审维度, enum: [ BUG, PERFORMANCE, SECURITY, STYLE, READABILITY ] }
    Severity: { type: string, description: 严重等级, enum: [ BLOCKER, CRITICAL, MINOR ] }
    RiskLevel: { type: string, description: 风险点等级, enum: [ HIGH, MEDIUM, LOW ] }
    Scenario: { type: string, description: 测试覆盖场景, enum: [ POSITIVE, BOUNDARY, EXCEPTION ] }
    ConfirmStatus: { type: integer, description: '评审意见确认状态; 0-待确认/1-有效/2-误报', enum: [ 0, 1, 2 ] }
    VerifyStatus: { type: integer, description: '测试用例验证状态; 0-待验证/1-已通过/2-已失败', enum: [ 0, 1, 2 ] }
    CaseSource: { type: integer, description: '测试用例来源; 0-AI生成/1-手动补充', enum: [ 0, 1 ] }
    PromptCategory: { type: string, description: 指令分类, enum: [ SYSTEM, REVIEW, TEST_GEN, COMMON ] }
    EnableStatus: { type: integer, description: '启用状态; 1-启用/0-停用', enum: [ 0, 1 ] }
    TriggeredBy: { type: integer, description: '触发方式; 0-Webhook/1-手动', enum: [ 0, 1 ] }
    FallbackMode: { type: string, description: 降级模式（FR-025）, enum: [ STANDARD, STREAMLINED, QUICK_SCAN, SHARDED ] }
    ChangeType: { type: string, description: 变更类型（阶段一输出）, enum: [ FEATURE, BUGFIX, REFACTOR, CHORE, OTHER ] }
    FeedbackType: { type: string, description: '反馈类型; CONFIRM-确认有效/REJECT-标记误报', enum: [ CONFIRM, REJECT ] }
    PlatformType: { type: string, description: 代码托管平台类型, enum: [ GITLAB, GITHUB, GITEA ] }
    ModelScene: { type: string, description: '模型适用场景; REVIEW-评审/TEST_GEN-测试生成', enum: [ REVIEW, TEST_GEN ] }
    NotifyChannel: { type: string, description: 通知渠道, enum: [ WECOM, DINGTALK, FEISHU, EMAIL ] }
    TriggerCondition: { type: string, description: 通知触发条件, enum: [ REVIEW_COMPLETED, BLOCKER_FOUND, TASK_FAILED, QUOTA_WARNING ] }
    SubjectType: { type: string, description: '配额/消耗主体类型', enum: [ DEPT, PROJECT ] }
    QuotaPeriod: { type: string, description: 配额周期（BR-COST-04）, enum: [ MONTH, WEEK ] }
    ResetType: { type: string, description: '配额重置方式; AUTO-自动/MANUAL-手动', enum: [ AUTO, MANUAL ] }
    QuotaStatusEnum: { type: string, description: '配额状态; NORMAL<80% / WARN≥80% / CRITICAL≥90% / BLOCKED=100%（SRS FR-021）', enum: [ NORMAL, WARN, CRITICAL, BLOCKED ] }
    PermSubjectType: { type: string, description: 数据权限主体类型, enum: [ ROLE, DEPT ] }
    ResourceType: { type: string, description: 数据权限资源类型, enum: [ REVIEW_TASK, DASHBOARD, RULE ] }
    DataScope: { type: string, description: '数据可见范围; ALL-全部/DEPT_AND_SUB-本部门及下级/SELF-仅本人', enum: [ ALL, DEPT_AND_SUB, SELF ] }
    RoleCode: { type: string, description: '角色标识; AUDITOR/OPERATOR 为预留角色 v1.0 不实现', enum: [ ADMIN, PM, QA, DEVELOPER, AUDITOR, OPERATOR ] }
    Granularity: { type: string, description: 质量趋势时间粒度, enum: [ DAY, WEEK, MONTH ] }
    ReviewTraceNodeType: { type: string, description: 变更追溯图谱节点类型, enum: [ FILE, REQUIREMENT, ISSUE, TESTCASE ] }

    # ── 请求体 wrapper（业务参数统一置于 param） ────────────────────
    ReqBody_Empty: { allOf: [ { $ref: '#/components/schemas/RpcEnvelopeRequest' } ] }
    ReqBody_Id: { allOf: [ { $ref: '#/components/schemas/RpcEnvelopeRequest' }, { type: object, properties: { param: { $ref: '#/components/schemas/IdParam' } } } ] }
    ReqBody_TaskId: { allOf: [ { $ref: '#/components/schemas/RpcEnvelopeRequest' }, { type: object, properties: { param: { $ref: '#/components/schemas/TaskIdParam' } } } ] }
    ReqBody_PageOnly: { allOf: [ { $ref: '#/components/schemas/RpcEnvelopeRequest' }, { type: object, properties: { param: { $ref: '#/components/schemas/PageRequest' } } } ] }
    ReqBody_ToggleStatus: { allOf: [ { $ref: '#/components/schemas/RpcEnvelopeRequest' }, { type: object, properties: { param: { $ref: '#/components/schemas/ToggleStatusParam' } } } ] }
    ReqBody_dashboardSummary: { allOf: [ { $ref: '#/components/schemas/RpcEnvelopeRequest' }, { type: object, properties: { param: { $ref: '#/components/schemas/DashboardSummaryParam' } } } ] }
    ReqBody_dashboardIssueDistribution: { allOf: [ { $ref: '#/components/schemas/RpcEnvelopeRequest' }, { type: object, properties: { param: { $ref: '#/components/schemas/DashboardIssueDistributionParam' } } } ] }
    ReqBody_dashboardQualityTrend: { allOf: [ { $ref: '#/components/schemas/RpcEnvelopeRequest' }, { type: object, properties: { param: { $ref: '#/components/schemas/DashboardQualityTrendParam' } } } ] }
    ReqBody_dashboardRepoAnalysis: { allOf: [ { $ref: '#/components/schemas/RpcEnvelopeRequest' }, { type: object, properties: { param: { $ref: '#/components/schemas/DashboardRepoAnalysisParam' } } } ] }
    ReqBody_reviewList: { allOf: [ { $ref: '#/components/schemas/RpcEnvelopeRequest' }, { type: object, properties: { param: { $ref: '#/components/schemas/ReviewListParam' } } } ] }
    ReqBody_reviewGetReport: { allOf: [ { $ref: '#/components/schemas/RpcEnvelopeRequest' }, { type: object, properties: { param: { $ref: '#/components/schemas/TaskIdParam' } } } ] }
    ReqBody_reviewConfirmComment: { allOf: [ { $ref: '#/components/schemas/RpcEnvelopeRequest' }, { type: object, properties: { param: { $ref: '#/components/schemas/ReviewConfirmCommentParam' } } } ] }
    ReqBody_reviewRejectComment: { allOf: [ { $ref: '#/components/schemas/RpcEnvelopeRequest' }, { type: object, properties: { param: { $ref: '#/components/schemas/ReviewRejectCommentParam' } } } ] }
    ReqBody_reviewAddTestCase: { allOf: [ { $ref: '#/components/schemas/RpcEnvelopeRequest' }, { type: object, properties: { param: { $ref: '#/components/schemas/AddTestCaseParam' } } } ] }
    ReqBody_reviewUpdateTestCaseStatus: { allOf: [ { $ref: '#/components/schemas/RpcEnvelopeRequest' }, { type: object, properties: { param: { $ref: '#/components/schemas/UpdateTestCaseStatusParam' } } } ] }
    ReqBody_reviewTrigger: { allOf: [ { $ref: '#/components/schemas/RpcEnvelopeRequest' }, { type: object, properties: { param: { $ref: '#/components/schemas/ReviewTriggerParam' } } } ] }
    ReqBody_reviewRetry: { allOf: [ { $ref: '#/components/schemas/RpcEnvelopeRequest' }, { type: object, properties: { param: { $ref: '#/components/schemas/ReviewRetryParam' } } } ] }
    ReqBody_promptList: { allOf: [ { $ref: '#/components/schemas/RpcEnvelopeRequest' }, { type: object, properties: { param: { $ref: '#/components/schemas/PromptListParam' } } } ] }
    ReqBody_promptSave: { allOf: [ { $ref: '#/components/schemas/RpcEnvelopeRequest' }, { type: object, properties: { param: { $ref: '#/components/schemas/PromptSaveParam' } } } ] }
    ReqBody_promptRollback: { allOf: [ { $ref: '#/components/schemas/RpcEnvelopeRequest' }, { type: object, properties: { param: { $ref: '#/components/schemas/PromptRollbackParam' } } } ] }
    ReqBody_promptEvaluate: { allOf: [ { $ref: '#/components/schemas/RpcEnvelopeRequest' }, { type: object, properties: { param: { $ref: '#/components/schemas/PromptEvaluateParam' } } } ] }
    ReqBody_ruleList: { allOf: [ { $ref: '#/components/schemas/RpcEnvelopeRequest' }, { type: object, properties: { param: { $ref: '#/components/schemas/RuleListParam' } } } ] }
