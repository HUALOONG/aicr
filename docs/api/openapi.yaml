openapi: 3.1.0

info:
  title: AI 驱动代码评审与测试生成平台 API
  version: 1.0.0
  summary: 控制台 RPC 接口与 Webhook 入站回调的字段级契约
  description: |
    本文件是**接口字段级契约的唯一事实依据**（覆盖 98 个接口），取代各设计文档中的示例片段。

    ## 统一约定
    - **风格**：RPC，`POST /api/v1/{module}/{action}`，不使用 RESTful。
    - **请求**：`Content-Type: application/json`，业务参数统一置于 `param` 字段，顶层可携带 `requestId`（UUID，缺省由服务端补全）。
    - **响应**：HTTP 200 + `{code, message, data, requestId}`；业务异常由 `code` 表达，不使用 HTTP 状态码区分业务错误。
    - **错误码**：`0` 成功 / `40001` 参数校验失败 / `40101` 未登录或 Token 过期 / `40301` 无权限 / `40401` 资源不存在 / `50001` 系统内部错误 / `50002` LLM 调用失败。
    - **认证**：`Authorization: Bearer {token}`（JWT，有效期 7 天）；`auth/login`、`auth/refreshToken`、`webhook/receive` 除外。
    - **权限**：每个操作的 `x-roles` 声明允许访问的角色；`AUDITOR` / `OPERATOR` 为预留角色，v1.0 不实现（SRS §5.2 注）。
    - **数据权限**：全部在后端 SQL 层按 `data_permission` 表驱动过滤（LLD §7.2），**前端不传递任何数据范围参数**。
    - **状态口径**：任务列表展示与筛选一律按业务状态 `sub_status`（14 态），`status`（主状态 0~4）仅用于统计聚合。

    ## 例外
    - `POST /webhook/receive` 是 Git 平台入站回调：**无 Bearer 认证**，改用平台签名校验；HTTP 状态码承载语义（200/401/400/503），见 SRS BR-W-09。

    ## 错误响应
    业务失败时仍返回 HTTP 200，由 `code` 表达（见上文错误码表）。参数校验失败（40001）时 `data` 中**可**携带 `detail` 对象，
    键为字段名、值为错误提示，前端按字段回填到表单；`detail` 为可选，未返回时仅展示 `message`：

    ```json
    {"code": 40001, "message": "参数校验失败", "data": {"detail": {"ruleCode": "规则编号已存在", "severity": "取值非法"}}, "requestId": "uuid"}
    ```

    ## 链路标识
    - `requestId`：客户端生成（UUID），置于请求/响应体顶层，原样回传。
    - `traceId`：服务端在 Webhook 入口生成，通过 HTTP 头 **`X-Trace-Id`** 透传，并贯穿 Kafka 消息与出站调用。

    两者语义与兜底规则见《编码规范》§7。

    ## 关联文档
    SRS（第 5 章接口需求）/ HLD（第 6 章接口概要）/ LLD（第 5 章接口详细设计）/ Prompt 设计说明书（指令变量与输出 Schema）/ 前端设计说明书（附录 A 页面↔接口映射）。

servers:
  - url: 'http://localhost:8080/api/v1'
    description: aicr-web（控制台 RPC 入口）
  - url: 'http://localhost:8081/api/v1'
    description: aicr-webhook（Git 平台入站回调，承载 /webhook/receive）

security:
  - bearerAuth: [ ]

tags:
  - name: 评审概览
    description: FR-001~004，宏观质量视图
  - name: 智能分析
    description: FR-005~007，任务列表、分析报告、变更追溯
  - name: 规则配置
    description: FR-008~011，指令、评审规则、测试策略、规则模板
  - name: 运维管理
    description: FR-012~013，系统监控与审计日志
  - name: 权限管理
    description: FR-014~017，用户、角色、部门、数据权限
  - name: 系统配置
    description: FR-018~020，平台接入、模型配置、通知设置
  - name: 成本管理
    description: FR-021，配额规则与消耗统计
  - name: 认证
    description: 登录、刷新令牌、登出、当前用户
  - name: 核心引擎
    description: FR-022~026，Webhook 接收、人工重试、反馈闭环

paths:
  # ── 评审概览（4） ────────────────────────────────────────────────
  /dashboard/summary:
    post:
      tags: [ 评审概览 ]
      summary: 概览总览（FR-001）
      operationId: dashboardSummary
      x-roles: [ ADMIN, PM, QA, DEVELOPER ]
      description: 4 个指标卡片 + 环比变化；综合评分公式 Score = 100 - (Blocker×10 + Critical×5 + Minor×1)，下限 0
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReqBody_dashboardSummary' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RespBody_dashboardSummary' } } } }

  /dashboard/issueDistribution:
    post:
      tags: [ 评审概览 ]
      summary: 问题分布（FR-002）
      operationId: dashboardIssueDistribution
      x-roles: [ ADMIN, PM, QA, DEVELOPER ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReqBody_dashboardIssueDistribution' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RespBody_dashboardIssueDistribution' } } } }

  /dashboard/qualityTrend:
    post:
      tags: [ 评审概览 ]
      summary: 质量趋势（FR-003）
      operationId: dashboardQualityTrend
      x-roles: [ ADMIN, PM, QA, DEVELOPER ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReqBody_dashboardQualityTrend' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RespBody_dashboardQualityTrend' } } } }

  /dashboard/repoAnalysis:
    post:
      tags: [ 评审概览 ]
      summary: 仓库分析（FR-004）
      operationId: dashboardRepoAnalysis
      x-roles: [ ADMIN, PM, QA, DEVELOPER ]
      description: ADMIN/PM/QA 可看全量；DEVELOPER 仅看有权限的仓库
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReqBody_dashboardRepoAnalysis' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RespBody_dashboardRepoAnalysis' } } } }

  # ── 智能分析（12） ───────────────────────────────────────────────
  /review/list:
    post:
      tags: [ 智能分析 ]
      summary: 任务列表（FR-005）
      operationId: reviewList
      x-roles: [ ADMIN, PM, QA, DEVELOPER ]
      description: 服务端分页，默认每页 20 条，按触发时间倒序；DEVELOPER 仅本人数据
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReqBody_reviewList' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RespBody_reviewList' } } } }

  /review/getReport:
    post:
      tags: [ 智能分析 ]
      summary: 分析报告（FR-006，首屏聚合三 Tab）
      operationId: reviewGetReport
      x-roles: [ ADMIN, PM, QA, DEVELOPER ]
      description: 一次返回任务信息 + 变更解读 + 评审意见 + 测试用例。评论或用例超过 200 条时改用 getChangeAnalysis / getReviewComments / getTestCases 分片加载（LLD §5.3.2）
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReqBody_reviewGetReport' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RespBody_reviewGetReport' } } } }

  /review/getChangeAnalysis:
    post:
      tags: [ 智能分析 ]
      summary: 变更解读（FR-006 Tab1）
      operationId: reviewGetChangeAnalysis
      x-roles: [ ADMIN, PM, QA, DEVELOPER ]
      description: 与 getReport 的 changeAnalysis 段同源；用于 Tab1 单独刷新或按需加载
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReqBody_TaskId' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RespBody_ChangeAnalysis' } } } }

  /review/getReviewComments:
    post:
      tags: [ 智能分析 ]
      summary: 评审意见列表（FR-006 Tab2）
      operationId: reviewGetReviewComments
      x-roles: [ ADMIN, PM, QA, DEVELOPER ]
      description: 评论超过 200 条时使用的分片接口
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReqBody_TaskId' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RespBody_ReviewCommentList' } } } }

  /review/getTestCases:
    post:
      tags: [ 智能分析 ]
      summary: 测试用例列表（FR-006 Tab3）
      operationId: reviewGetTestCases
      x-roles: [ ADMIN, PM, QA, DEVELOPER ]
      description: 用例超过 200 条时使用的分片接口
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReqBody_TaskId' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RespBody_TestCaseList' } } } }

  /review/getTrace:
    post:
      tags: [ 智能分析 ]
      summary: 变更追溯图谱（FR-007）
      operationId: reviewGetTrace
      x-roles: [ ADMIN, PM, QA, DEVELOPER ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReqBody_TaskId' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RespBody_reviewGetTrace' } } } }

  /review/confirmComment:
    post:
      tags: [ 智能分析 ]
      summary: 确认评审意见有效（FR-006）
      operationId: reviewConfirmComment
      x-roles: [ ADMIN, PM, QA ]
      description: 置 review_comment.confirm_status=1；驱动 FR-026 确认样本库
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReqBody_reviewConfirmComment' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RespBody_OpResult' } } } }

  /review/rejectComment:
    post:
      tags: [ 智能分析 ]
      summary: 标记评审意见为误报（FR-006）
      operationId: reviewRejectComment
      x-roles: [ ADMIN, PM, QA ]
      description: 置 review_comment.confirm_status=2；驱动 FR-026 误报特征库（BR-FB-01）与 TOPIC_FEEDBACK 消息
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReqBody_reviewRejectComment' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RespBody_OpResult' } } } }

  /review/addTestCase:
    post:
      tags: [ 智能分析 ]
      summary: 手动补充测试用例（FR-006 Tab3）
      operationId: reviewAddTestCase
      x-roles: [ ADMIN, PM, QA ]
      description: 落 test_case 时 source=1（手动）
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReqBody_reviewAddTestCase' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RespBody_IdResult' } } } }

  /review/updateTestCaseStatus:
    post:
      tags: [ 智能分析 ]
      summary: 标注测试用例验证状态（FR-006 Tab3）
      operationId: reviewUpdateTestCaseStatus
      x-roles: [ ADMIN, PM, QA ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReqBody_reviewUpdateTestCaseStatus' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RespBody_OpResult' } } } }

  /review/trigger:
    post:
      tags: [ 智能分析 ]
      summary: 手动触发评审（FR-005）
      operationId: reviewTrigger
      x-roles: [ ADMIN, PM ]
      description: service 仅发送 Kafka TOPIC_REVIEW_REQUEST，不直接调用 engine（HLD 红线二）
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReqBody_reviewTrigger' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RespBody_reviewTrigger' } } } }

  /review/retry:
    post:
      tags: [ 智能分析 ]
      summary: 重试评审任务（FR-005）
      operationId: reviewRetry
      x-roles: [ ADMIN, PM ]
      description: 发送 Kafka TOPIC_REVIEW_RETRY；retryFrom 允许 FAILED / TIMEOUT / DEGRADED / PARTIAL_SUCCESS
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReqBody_reviewRetry' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RespBody_OpResult' } } } }

  # ── 规则配置（24） ───────────────────────────────────────────────
  /prompt/list:
    post:
      tags: [ 规则配置 ]
      summary: 指令列表（FR-008）
      operationId: promptList
      x-roles: [ ADMIN, PM, QA ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReqBody_promptList' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RespBody_promptList' } } } }

  /prompt/getById:
    post:
      tags: [ 规则配置 ]
      summary: 指令详情（FR-008）
      operationId: promptGetById
      x-roles: [ ADMIN, PM, QA ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReqBody_Id' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RespBody_PromptDetail' } } } }

  /prompt/create:
    post:
      tags: [ 规则配置 ]
      summary: 创建指令（FR-008）
      operationId: promptCreate
      x-roles: [ ADMIN, PM ]
      description: SYSTEM 分类启用项全局唯一，启用第 2 条时返回 40001（Prompt 设计说明书 §2.1）
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReqBody_promptSave' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RespBody_IdResult' } } } }

  /prompt/update:
    post:
      tags: [ 规则配置 ]
      summary: 更新指令（FR-008）
      operationId: promptUpdate
      x-roles: [ ADMIN, PM ]
      description: 自动 current_version+1 并写 prompt_version；必须携带 changeDesc
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReqBody_promptSave' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RespBody_IdResult' } } } }

  /prompt/delete:
    post:
      tags: [ 规则配置 ]
      summary: 删除指令（FR-008）
      operationId: promptDelete
      x-roles: [ ADMIN ]
      description: 被规则/策略快照引用的模板不做物理删除（快照为文本副本，无外键）
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReqBody_Id' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RespBody_OpResult' } } } }

  /prompt/getVersions:
    post:
      tags: [ 规则配置 ]
      summary: 指令版本历史（FR-008）
      operationId: promptGetVersions
      x-roles: [ ADMIN, PM ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReqBody_Id' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RespBody_PromptVersionList' } } } }

  /prompt/rollback:
    post:
      tags: [ 规则配置 ]
      summary: 指令版本回滚（FR-008）
      operationId: promptRollback
      x-roles: [ ADMIN ]
      description: 恢复指定版本内容并再生成一个新版本，不覆盖历史
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReqBody_promptRollback' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RespBody_IdResult' } } } }

  /prompt/evaluate:
    post:
      tags: [ 规则配置 ]
      summary: 指令效果评估（FR-008 / BR-FB-04）
      operationId: promptEvaluate
      x-roles: [ ADMIN, PM ]
      description: 按 prompt_version 分组统计确认率/误报率；对比区间任务量 <30 时返回 code=0 且 data.conclusion=sampleInsufficient
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReqBody_promptEvaluate' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RespBody_promptEvaluate' } } } }

  /rule/list:
    post:
      tags: [ 规则配置 ]
      summary: 评审规则列表（FR-009）
      operationId: ruleList
      x-roles: [ ADMIN, PM, QA, DEVELOPER ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReqBody_ruleList' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RespBody_ruleList' } } } }

  /rule/getById:
    post:
      tags: [ 规则配置 ]
      summary: 评审规则详情（FR-009）
      operationId: ruleGetById
      x-roles: [ ADMIN, PM, QA, DEVELOPER ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReqBody_Id' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RespBody_RuleDetail' } } } }

  /rule/create:
    post:
      tags: [ 规则配置 ]
      summary: 创建评审规则（FR-009）
      operationId: ruleCreate
      x-roles: [ ADMIN, PM ]
      description: promptTemplate 为从指令库选用的文本快照（去规范化存储，非外键）
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReqBody_ruleSave' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RespBody_IdResult' } } } }

  /rule/update:
    post:
      tags: [ 规则配置 ]
      summary: 更新评审规则（FR-009）
      operationId: ruleUpdate
      x-roles: [ ADMIN, PM ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReqBody_ruleSave' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RespBody_IdResult' } } } }

  /rule/delete:
    post:
      tags: [ 规则配置 ]
      summary: 删除评审规则（FR-009）
      operationId: ruleDelete
      x-roles: [ ADMIN ]
      description: 系统内置规则（isSystem=1）禁止删除，返回 40301
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReqBody_Id' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RespBody_OpResult' } } } }

  /rule/toggleStatus:
    post:
      tags: [ 规则配置 ]
      summary: 切换规则启用状态（FR-009）
      operationId: ruleToggleStatus
      x-roles: [ ADMIN, PM ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReqBody_ToggleStatus' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RespBody_OpResult' } } } }

  /testStrategy/list:
    post:
      tags: [ 规则配置 ]
      summary: 测试策略列表（FR-010）
      operationId: testStrategyList
      x-roles: [ ADMIN, PM, QA ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReqBody_PageOnly' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RespBody_testStrategyList' } } } }

  /testStrategy/create:
    post:
      tags: [ 规则配置 ]
      summary: 创建测试策略（FR-010）
      operationId: testStrategyCreate
      x-roles: [ ADMIN, PM ]
      description: 设为全局默认（isDefault=1）时自动取消其它策略的默认标记
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReqBody_testStrategySave' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RespBody_IdResult' } } } }

  /testStrategy/update:
    post:
      tags: [ 规则配置 ]
      summary: 更新测试策略（FR-010）
      operationId: testStrategyUpdate
      x-roles: [ ADMIN, PM ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReqBody_testStrategySave' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RespBody_IdResult' } } } }

  /testStrategy/delete:
    post:
      tags: [ 规则配置 ]
      summary: 删除测试策略（FR-010）
